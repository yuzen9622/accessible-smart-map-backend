# Full stack: Node API + MongoDB + OTP2 transit-engine sidecar.
#
#   docker compose up -d            # build + start everything
#   docker compose up -d otp        # OTP only (serve prebuilt graph)
#   src/scripts/build-otp-graph.sh  # weekly graph rebuild (cron, spec §5)
#
# Services reach each other by name on the default compose network:
#   backend → mongo:27017, otp:8080  (so OTP_BASE_URL/DATABASE_URL are overridden
#   below to those, regardless of the localhost values in .env).
services:
  backend:
    build: .
    container_name: taipei-backend
    # env_file injects the whole .env into the container environment, so
    # `node dist/server.js` sees the vars WITHOUT needing dotenv. The
    # host-centric values are overridden for the compose network below.
    env_file: .env
    environment:
      OTP_BASE_URL: http://otp:8080
      VALHALLA_BASE_URL: http://valhalla:8002
      DATABASE_URL: mongodb://${MONGO_ROOT_USER}:${MONGO_ROOT_PASSWORD}@mongo:27017/accessible_map?authSource=admin
      # 容器內走服務名；.env 的 127.0.0.1:5433 是給 host 腳本與測試用
      PED_GRAPH_DATABASE_URL: postgresql://${PED_PG_USER}:${PED_PG_PASSWORD}@postgis:5432/ped_graph
      # .env's CHROMA_URL is host-centric (localhost:8100); inside the container
      # localhost is the container itself, so reach the chroma service by name.
      CHROMA_URL: http://chroma:8000
      # .env's GCS_KEY_FILE is a host path; mount it (below) and point the
      # container at the in-container path so GCS auth works inside Docker.
      GCS_KEY_FILE: /secrets/gcs-key.json
      # LINE conversation state (pending intent + chat history) lives in Redis;
      # reach the redis service by name on the compose network.
      REDIS_URL: redis://redis:6379
    volumes:
      # Bind the service-account JSON (host path from .env) read-only.
      - ${GCS_KEY_FILE}:/secrets/gcs-key.json:ro
    ports:
      # Publish the API. Prefix 127.0.0.1: to keep it host-only.
      - "127.0.0.1:${PORT:-8000}:${PORT:-8000}"
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      otp:
        condition: service_started
      valhalla:
        condition: service_started
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: redis
    # Ephemeral conversation cache (pending intent TTL 30m, chat history);
    # no host port published — only the backend (same network) reaches it.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  mongo:
    image: mongo:7
    container_name: mongo
    # Root creds enable auth on first init; the API connects as root with
    # authSource=admin (internal single-app DB). MONGO_ROOT_* come from .env.
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    volumes:
      - mongo-data:/data/db
    ports:
      - "127.0.0.1:27018:27017"
    # No host port published — only the backend (same network) reaches it.
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  postgis:
    image: postgis/postgis:16-3.4
    container_name: postgis
    environment:
      POSTGRES_USER: ${PED_PG_USER}
      POSTGRES_PASSWORD: ${PED_PG_PASSWORD}
      POSTGRES_DB: ped_graph
    volumes:
      - postgis-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PED_PG_USER} -d ped_graph"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  otp:
    # Pin the minor version (spec §4.1) — never `latest`.
    # 2.9.0 (Java 25): planConnection supports stop-location origins, which
    # bypasses broken street linking at station plazas (e.g. 台中車站 island).
    image: opentripplanner/opentripplanner:2.9.0
    container_name: otp
    # The official image's entrypoint hardcodes /var/opentripplanner as the
    # data directory — pass flags only, never a path.
    command: ["--load"]
    ports:
      # "主機埠:容器埠" — 主機 8080 已被佔用，改用 18080 對外；容器內仍是
      # 8080，backend 走內網 otp:8080 連，不受影響。
      - "127.0.0.1:18080:8080"
    volumes:
      - ${OTP_DATA_DIR:-/var/otp}:/var/opentripplanner
    environment:
      # Serve heap: national feed + full Taiwan OSM needs ~6–8 GB; a
      # single-city clip runs in 2–4 GB.
      JAVA_TOOL_OPTIONS: "-Xmx${OTP_SERVE_XMX:-6g}"
    healthcheck:
      # The 2.9 image ships no curl/wget; bash /dev/tcp suffices — Grizzly only
      # binds 8080 after the graph is loaded, so TCP-open ⇒ ready for routing.
      test: ["CMD", "bash", "-c", "</dev/tcp/localhost/8080"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s
    restart: unless-stopped

  valhalla:
    image: ghcr.io/valhalla/valhalla:3.8.2@sha256:a4eae918af15ffb392a6c1434bc64083d28f022d5968a02cba09780ba54cd62d
    container_name: valhalla
    command:
      - bash
      - -lc
      - >-
        test -f /custom_files/active/valhalla.json ||
        { echo 'Valhalla config missing: run pnpm build:valhalla-tiles first' >&2; exit 78; };
        exec valhalla_service /custom_files/active/valhalla.json ${VALHALLA_THREADS:-2}
    ports:
      - "127.0.0.1:8002:8002"
    volumes:
      - ${VALHALLA_DATA_DIR:-./valhalla-data}:/custom_files
    healthcheck:
      test: ["CMD", "bash", "-c", "</dev/tcp/localhost/8002"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 120s
    restart: unless-stopped

  valhalla-build:
    image: ghcr.io/valhalla/valhalla:3.8.2@sha256:a4eae918af15ffb392a6c1434bc64083d28f022d5968a02cba09780ba54cd62d
    profiles: ["valhalla-build"]
    entrypoint: ["bash", "-lc"]
    volumes:
      - ${VALHALLA_DATA_DIR:-./valhalla-data}:/custom_files
      - ${VALHALLA_PBF_PATH:-./otp-data/taiwan-latest.osm.pbf}:/data/input.osm.pbf:ro

  chroma:
    image: chromadb/chroma:latest
    container_name: chroma
    ports:
      - "127.0.0.1:8100:8000"
    volumes:
      - chroma-data:/chroma/chroma
    restart: unless-stopped
  cloudflare-tunnel:
    image: cloudflare/cloudflared:latest
    container_name: cloudflare-tunnel

    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    restart: always

networks:
  tunnel-net:
    driver: bridge
volumes:
  mongo-data:
  chroma-data:
  postgis-data:
