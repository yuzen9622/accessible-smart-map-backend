# Full stack: Node API + MongoDB + OTP2 transit-engine sidecar.
#
#   docker compose up -d            # build + start everything
#   docker compose up -d otp        # OTP only (serve prebuilt graph)
#   src/scripts/build-otp-graph.sh  # weekly graph rebuild (cron, spec §5)
#
# Services reach each other by name on the default compose network:
#   backend → mongo:27017, otp:8080 (OTP_BASE_URL/DATABASE_URL below override
#   the localhost values in .env).
services:
  backend:
    build: .
    container_name: taipei-backend
    # env_file injects the whole .env into the container environment, so
    # `node dist/server.js` sees the vars WITHOUT needing dotenv. The
    # host-centric values are overridden for the compose network below.
    env_file: .env
    environment:
      OTP_BASE_URL: http://otp:8080
      VALHALLA_BASE_URL: http://valhalla:8002
      DATABASE_URL: >-
        mongodb://${MONGO_ROOT_USER}:${MONGO_ROOT_PASSWORD}@mongo:27017/accessible_map?authSource=admin&replicaSet=rs0
      # 容器內走服務名；.env 的 127.0.0.1:5433 是給 host 腳本與測試用
      PED_GRAPH_DATABASE_URL: >-
        postgresql://${PED_PG_USER}:${PED_PG_PASSWORD}@postgis:5432/ped_graph
      # .env's CHROMA_URL is host-centric (localhost:8100); inside the container
      # localhost is the container itself, so reach the chroma service by name.
      CHROMA_URL: http://chroma:8000
      # .env's GCS_KEY_FILE is a host path; mount it (below) and point the
      # container at the in-container path so GCS auth works inside Docker.
      GCS_KEY_FILE: /secrets/gcs-key.json
      # LINE conversation state (pending intent + chat history) lives in Redis;
      # reach the redis service by name on the compose network.
      REDIS_URL: redis://redis:6379
    networks:
      - default
      - shared
    volumes:
      # Bind the service-account JSON (host path from .env) read-only.
      - ${GCS_KEY_FILE}:/secrets/gcs-key.json:ro
      - ${VALHALLA_DATA_DIR:-./valhalla-data}:/app/valhalla-data
    ports:
      # Publish the API. Prefix 127.0.0.1: to keep it host-only.
      - "127.0.0.1:${PORT:-8000}:${PORT:-8000}"
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      otp:
        condition: service_started
      valhalla:
        condition: service_started
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: redis
    # Ephemeral conversation cache (pending intent TTL 30m, chat history);
    # no host port published — only the backend (same network) reaches it.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  mongo:
    image: mongo:7
    container_name: mongo
    entrypoint: ["bash", "/opt/mongo/entrypoint.sh"]
    # Reap any orphaned children during startup/shutdown.
    init: true
    stop_grace_period: 30s
    # Root creds enable auth on first init; the API connects as root with
    # authSource=admin (internal single-app DB). MONGO_ROOT_* come from .env.
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    volumes:
      - mongo-data:/data/db
      - mongo-keyfile:/data/keyfile
    configs:
      - source: mongo-entrypoint
        target: /opt/mongo/entrypoint.sh
      - source: mongo-bootstrap
        target: /opt/mongo/bootstrap.sh
      - source: mongo-init
        target: /opt/mongo/init.js
    ports:
      - "127.0.0.1:27018:27017"
    # Startup validates the topology; health is read-only and requires PRIMARY.
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - >-
          if (!require('fs').existsSync('/tmp/mongo-ready')) quit(1);
          const h=db.hello();
          quit(h.setName === 'rs0' && h.isWritablePrimary ? 0 : 1)
      interval: 10s
      timeout: 5s
      retries: 5
      # Allow startup's 120s readiness + 30s election budget.
      start_period: 150s
    restart: unless-stopped

  postgis:
    image: postgis/postgis:16-3.4-alpine
    container_name: postgis
    environment:
      POSTGRES_USER: ${PED_PG_USER}
      POSTGRES_PASSWORD: ${PED_PG_PASSWORD}
      POSTGRES_DB: ped_graph
    volumes:
      - postgis-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PED_PG_USER} -d ped_graph"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  otp:
    # Pin the minor version (spec §4.1) — never `latest`.
    # 2.9.0 (Java 25): planConnection supports stop-location origins, which
    # bypasses broken street linking at station plazas (e.g. 台中車站 island).
    image: opentripplanner/opentripplanner:2.9.0
    container_name: otp
    # The official image's entrypoint hardcodes /var/opentripplanner as the
    # data directory — pass flags only, never a path.
    command: ["--load"]
    ports:
      # "主機埠:容器埠" — 主機 8080 已被佔用，改用 18080 對外；容器內仍是
      # 8080，backend 走內網 otp:8080 連，不受影響。
      - "127.0.0.1:18080:8080"
    volumes:
      - ${OTP_DATA_DIR:-/var/otp}:/var/opentripplanner
    environment:
      # Serve heap: national feed + full Taiwan OSM needs ~6–8 GB; a
      # single-city clip runs in 2–4 GB.
      JAVA_TOOL_OPTIONS: "-Xmx${OTP_SERVE_XMX:-6g}"
    healthcheck:
      # The 2.9 image ships no curl/wget; bash /dev/tcp suffices — Grizzly only
      # binds 8080 after the graph is loaded, so TCP-open ⇒ ready for routing.
      test: ["CMD", "bash", "-c", "</dev/tcp/localhost/8080"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s
    restart: unless-stopped

  valhalla:
    image: ghcr.io/valhalla/valhalla:3.9.1@sha256:4fd114eb1d26b8fc2f43bcb3df234c1b63a0bf13c277405e5943d5361dc575de # yamllint disable-line rule:line-length
    container_name: valhalla
    command:
      - bash
      - -lc
      - >-
        test -f /custom_files/active/valhalla.json ||
        { echo 'Valhalla config missing: run pnpm build:valhalla-tiles first'
        >&2; exit 78; };
        exec valhalla_service /custom_files/active/valhalla.json
        ${VALHALLA_THREADS:-2}
    ports:
      - "127.0.0.1:8002:8002"
    volumes:
      - ${VALHALLA_DATA_DIR:-./valhalla-data}:/custom_files
    healthcheck:
      test: ["CMD", "bash", "-c", "</dev/tcp/localhost/8002"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 120s
    restart: unless-stopped

  valhalla-build:
    image: ghcr.io/valhalla/valhalla:3.9.1@sha256:4fd114eb1d26b8fc2f43bcb3df234c1b63a0bf13c277405e5943d5361dc575de # yamllint disable-line rule:line-length
    profiles: ["valhalla-build"]
    entrypoint: ["bash", "-lc"]
    volumes:
      - ${VALHALLA_DATA_DIR:-./valhalla-data}:/custom_files
      - ${VALHALLA_PBF_PATH:-./otp-data/taiwan-latest.osm.pbf}:/data/input.osm.pbf:ro

  chroma:
    image: chromadb/chroma:latest
    container_name: chroma
    ports:
      - "127.0.0.1:8100:8000"
    volumes:
      - chroma-data:/chroma/chroma
    restart: unless-stopped
  cloudflare-tunnel:
    image: cloudflare/cloudflared:latest
    container_name: cloudflare-tunnel

    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    restart: always

# Keep deployment scripts inline; no separate infra files or bind mounts.
# configs.content requires Docker Compose >= 2.23.1.
configs:
  mongo-entrypoint:
    content: |
      #!/usr/bin/env bash
      set -Eeuo pipefail
      # Persistent auth key; never print it or regenerate it on restart.
      key=/data/keyfile/keyfile
      if [ ! -s "$$key" ]; then
        umask 077
        openssl rand -base64 756 > "$$key.tmp"
        chown mongodb:mongodb "$$key.tmp"
        chmod 400 "$$key.tmp"
        mv "$$key.tmp" "$$key"
      fi
      chown mongodb:mongodb "$$key"
      chmod 400 "$$key"
      # Never inherit a successful readiness marker across container restarts.
      rm -f /tmp/mongo-ready /tmp/docker-entrypoint-temp-mongod.pid
      mongo_pid=''
      init_pid=''
      cleanup() {
        trap - EXIT TERM INT
        rm -f /tmp/mongo-ready
        # Forward shutdown to both process groups and reap direct children.
        if [ -n "$$init_pid" ]; then
          kill -TERM -- "-$$init_pid" 2>/dev/null || true
        fi
        if [ -n "$$mongo_pid" ]; then
          kill -TERM -- "-$$mongo_pid" 2>/dev/null || true
        fi
        # The official first-boot mongod uses --fork (its own session).
        if [ -s /tmp/docker-entrypoint-temp-mongod.pid ]; then
          temp_pid=$$(< /tmp/docker-entrypoint-temp-mongod.pid)
          if [[ "$$temp_pid" =~ ^[0-9]+$$ ]]; then
            kill -TERM "$$temp_pid" 2>/dev/null || true
            deadline=$$((SECONDS + 25))
            while kill -0 "$$temp_pid" 2>/dev/null &&
              (( SECONDS < deadline )); do
              sleep 0.1
            done
          fi
        fi
        wait 2>/dev/null || true
      }
      trap cleanup EXIT
      trap 'exit 143' TERM
      trap 'exit 130' INT
      setsid /usr/local/bin/docker-entrypoint.sh mongod \
        --replSet rs0 --keyFile "$$key" --bind_ip_all --oplogSize 256 &
      mongo_pid=$$!
      setsid bash /opt/mongo/bootstrap.sh &
      init_pid=$$!
      status=0
      finished=''
      wait -n -p finished "$$mongo_pid" "$$init_pid" || status=$$?
      if [ "$$finished" != "$$init_pid" ] || [ "$$status" -ne 0 ]; then
        echo 'MongoDB startup failed; stopping container' >&2
        if [ "$$status" -eq 0 ]; then status=1; fi
        exit "$$status"
      fi
      init_pid=''
      touch /tmp/mongo-ready
      # Stay alive for mongod; Docker's restart policy handles unexpected exits.
      wait "$$mongo_pid"
  mongo-bootstrap:
    content: |
      #!/usr/bin/env bash
      set -Eeuo pipefail
      # Use the network address, not loopback: the official image starts a
      # temporary localhost-only standalone while creating the first root user.
      uri='mongodb://mongo:27017/admin?directConnection=true'
      uri="$${uri}&serverSelectionTimeoutMS=2000&connectTimeoutMS=2000"
      deadline=$$((SECONDS + 120))
      until mongosh "$$uri" --quiet --eval '
        const admin = db.getSiblingDB("admin");
        if (!admin.auth(
          process.env.MONGO_INITDB_ROOT_USERNAME,
          process.env.MONGO_INITDB_ROOT_PASSWORD
        )) quit(1);
        quit(admin.runCommand({ping: 1}).ok ? 0 : 1);
      ' >/dev/null 2>&1; do
        if (( SECONDS >= deadline )); then
          echo 'MongoDB authenticated startup timed out' >&2
          exit 1
        fi
        sleep 1
      done
      exec mongosh "$$uri" --quiet /opt/mongo/init.js
  mongo-init:
    content: |
      // Explicit init; run mongosh --quiet /opt/mongo/init.js via compose exec.
      // Credentials stay inside the container; only topology status is printed.
      const admin = db.getSiblingDB("admin");
      if (
        !admin.auth(
          process.env.MONGO_INITDB_ROOT_USERNAME,
          process.env.MONGO_INITDB_ROOT_PASSWORD,
        )
      ) {
        throw new Error("MongoDB authentication failed");
      }
      let initialized = false;
      try {
        const config = rs.conf();
        if (
          config._id !== "rs0" ||
          config.members.length !== 1 ||
          config.members[0].host !== "mongo:27017"
        ) {
          throw new Error(
            "Unexpected replica set configuration; refusing to reconfigure",
          );
        }
        initialized = true;
      } catch (error) {
        if (error.code !== 94) throw error; // NotYetInitialized only
      }
      if (!initialized)
        rs.initiate({ _id: "rs0", members: [{ _id: 0, host: "mongo:27017" }] });
      for (let attempt = 0; attempt < 60; attempt++) {
        const hello = db.hello();
        if (hello.setName === "rs0" && hello.isWritablePrimary) {
          print("rs0 PRIMARY ready");
          quit(0);
        }
        sleep(500);
      }
      throw new Error("Replica set did not elect a PRIMARY within 30 seconds");

networks:
  shared:
    external: true
    name: accessible-shared
volumes:
  mongo-data:
    # Fixed on purpose: the restored 2026-10-19 volume; switch only by editing this line.
    name: taipei-accessible-backend_mongo-restored-20261019
  mongo-keyfile:
  chroma-data:
  postgis-data:
